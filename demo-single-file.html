<!doctype html>
<html lang="th" data-app="judge">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#084c32" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="PI Champion Season 2 – interactive UI prototype for KAsset live judging and results reveal." />
  <title>PI Champion Season 2 · Judge Scoring</title>
  <style>
:root {
  --ink:#15392e; --ink-sub:#60736b; --deep:#053925; --deep-2:#075a37;
  --green:#08943e; --green-2:#0cb74a; --lime:#b6f477; --ivory:#fbfaf7;
  --border:#e9e6de; --panel:#fffefa; --soft:#f4f9ee; --shade:#edf6e9;
  --amber:#d18a18; --amber-bg:#fff6e4; --white:#fff;
  --shadow:0 16px 50px rgba(25,54,37,.08), 0 2px 6px rgba(25,54,37,.055);
  --radius:24px;
  color-scheme:light;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--ivory); color:var(--ink); font-family:Inter, "IBM Plex Sans Thai", "Noto Sans Thai", "Sarabun", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height:1.45; }
button,input,select { font:inherit; }
button {cursor:pointer; }
button:disabled {opacity:.48;cursor:not-allowed;}
button:focus-visible,input:focus-visible,select:focus-visible {outline:3px solid #82d98e;outline-offset:3px;}
h1,h2,h3,p {margin:0;}
h1 {font-size:clamp(2rem,4.5vw,4rem);line-height:1.12;letter-spacing:-.055em;}
h2 {font-size:clamp(1.35rem,2.3vw,1.95rem);letter-spacing:-.035em;}
h3 {font-size:1.04rem;letter-spacing:-.02em;}
small,.muted {color:var(--ink-sub);}
a {color:var(--deep-2);}
#app {min-height:100vh;}
.boot-loading {padding:4rem;text-align:center;color:var(--deep);}
.site-head {position:sticky;top:0;z-index:20; background:rgba(255,254,251,.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.header-inner {max-width:1500px;margin:auto;min-height:78px;padding:12px 28px;display:flex;gap:20px;align-items:center;justify-content:space-between;}
.brand {display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;}
.brand-mark {display:flex;align-items:center;gap:8px;white-space:nowrap;}
.brand-title {font-size:1.65rem;font-weight:850;letter-spacing:-.07em;color:#807970;line-height:1;}
.sprout {width:30px;height:30px;border:2px solid #e94043;border-radius:50%;display:grid;place-items:center;background:white;flex:none;}
.sprout svg{width:23px;height:23px;}
.brand-divider {height:34px;width:1px;background:#d9d8ce;}
.event-name {font-size:1rem;line-height:1.13;font-weight:820;color:var(--deep);}
.event-name em{color:var(--green);font-style:italic;}
.head-right {display:flex;align-items:center;gap:9px;}
.header-nav {display:flex;gap:4px;align-items:center;}
.head-link {border:0;background:transparent;padding:9px 14px;border-radius:12px;color:#45675a;font-weight:740;font-size:.87rem;}
.head-link:hover,.head-link.active {background:var(--shade);color:var(--deep-2);}
.demo-label {display:inline-flex;align-items:center;gap:7px;border:1px solid #ddedcb;color:#4d723f;background:#f0f9e8;border-radius:999px;padding:6px 10px;font-size:.72rem;font-weight:800;white-space:nowrap;}
.avatar {width:38px;height:38px;border-radius:15px;background:linear-gradient(150deg,#e9ffdb,#9ed46c);display:grid;place-items:center;color:#0c6839;font-size:1.4rem;box-shadow:inset 0 2px 3px #ffffffa0;}
.shell {max-width:1500px;margin:auto;padding:30px 28px 80px;}
.halo {position:relative;overflow:hidden;isolation:isolate;}
.halo:after {content:"";position:absolute;pointer-events:none;z-index:-1; width:65%;height:150%;right:-12%;top:-45%;opacity:.85;transform:rotate(-21deg);border-radius:50%;background:radial-gradient(ellipse at 50% 50%,rgba(165,239,95,.5) 0%,rgba(5,146,61,.22) 32%,rgba(5,146,61,0) 68%);}
.wave-art {position:absolute;pointer-events:none;inset:auto -8% -28% auto;width:66%;height:115%;opacity:.75; z-index:0;}
.wave-art path {fill:none;stroke-linecap:round;}
.hero {background:linear-gradient(105deg,#fffdf9 15%,#f6faed 67%,#e7f7d8);border:1px solid #e6e9d8;border-radius:30px;padding:clamp(28px,5vw,62px); min-height:360px;box-shadow:var(--shadow);}
.hero>*:not(.wave-art) {position:relative;z-index:1;}
.eyebrow {text-transform:uppercase;letter-spacing:.16em;font-size:.73rem;font-weight:850;color:var(--green);}
.hero .eyebrow{margin-bottom:13px;}
.hero p {max-width:600px;color:#576f60;font-size:1.04rem;margin:18px 0 27px;}
.hero-actions {display:flex;gap:12px;flex-wrap:wrap;}
.btn {border:none;border-radius:14px;padding:12px 18px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .16s,box-shadow .16s,background .16s;min-height:46px;}
.btn:not(:disabled):hover {transform:translateY(-1px);box-shadow:0 8px 20px rgba(7,96,54,.15);}
.btn.primary {background:linear-gradient(150deg,#00a43e,#006c38);color:white;box-shadow:0 6px 16px #00864530;}
.btn.lime {background:linear-gradient(120deg,#c9ff7f,#a1e653);color:#0b4027;}
.btn.light {background:#f0f5e9;color:#164d31;}
.btn.outline {border:1px solid #c9d8c8;background:#fffdfa;color:var(--deep);}
.btn.ghost {background:transparent;color:var(--deep-2);}
.btn.small {padding:8px 12px;min-height:36px;font-size:.8rem;border-radius:10px;}
.btn.wide {width:100%;}
.icon {width:19px;height:19px;display:inline-block;vertical-align:middle; flex-shrink:0;}
.feature-row {margin-top:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.feature {background:white;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:var(--shadow);}
.feature .glyph {width:45px;height:45px;border-radius:13px;background:#eaf8df;color:#138144;display:grid;place-items:center;margin-bottom:14px;}
.feature p {color:var(--ink-sub);font-size:.88rem;margin-top:7px;}
.page-top {margin-bottom:22px;display:flex;align-items:flex-start;gap:15px;justify-content:space-between;}
.page-top p{color:var(--ink-sub);margin-top:6px;}
.page-title {display:flex;align-items:center;gap:12px;}
.kicker {color:var(--green);font-size:.75rem;letter-spacing:.12em;font-weight:880;text-transform:uppercase;margin-bottom:7px;}
.card {background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
.card-pad {padding:23px;}
.pill {display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:.73rem;font-weight:800;padding:5px 10px;background:#f3f4ee;color:#647267;white-space:nowrap;}
.pill.good{background:#e7f6e2;color:#08773d;}
.pill.warn{background:var(--amber-bg);color:#9a6310;}
.pill.lime{background:#dffcb9;color:#2e6a21;}
.pill.dark{background:#0e593d;color:white;}
.pill.outline{border:1px solid #dfe5db;background:white;}
.label {font-size:.82rem;font-weight:800;color:#547161;display:block;margin-bottom:8px;}
.input {width:100%;border:1px solid #d6ded2;border-radius:14px;background:white;color:var(--deep);padding:12px 14px;min-height:49px;}
.input:focus {border-color:#079845;}
.access {max-width:510px;margin:4vh auto;position:relative;overflow:hidden;}
.access>.card-pad {padding:34px;}
.access-brand {height:65px;width:65px;display:grid;place-items:center;border-radius:21px;background:linear-gradient(130deg,#d7f7c8,#eff9e6);color:var(--green);margin-bottom:24px;}
.access .subcopy {color:var(--ink-sub);margin:9px 0 25px;}
.access-hint {margin-top:13px;padding:12px 14px;border-radius:14px;background:#edf8e4;font-size:.87rem;color:#2c6743;}
.access .input {font-size:1.22rem;font-weight:800;letter-spacing:.09em;text-align:center;text-transform:uppercase;}
.error {color:#a23c26;margin-top:9px;font-size:.85rem;}
.footer-note {text-align:center;color:#748377;font-size:.79rem;margin-top:30px;}
.chip-row {display:flex;gap:7px;flex-wrap:wrap;}
.chip {border:1px solid #d8e1d3;background:#fffefa;color:#476552;border-radius:999px;padding:8px 13px;font-weight:780;font-size:.79rem;}
.chip.active{background:#08683e;border-color:#08683e;color:white;}
.stat-strip {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:19px;}
.stat {border-radius:20px;background:#fffefb;border:1px solid var(--border);padding:17px 19px;box-shadow:var(--shadow);}
.stat strong {display:block;font-size:1.8rem;line-height:1.1;letter-spacing:-.05em;color:#075b36;margin-top:4px;}
.stat span {font-size:.78rem;color:#6c8174;font-weight:740;}
.team-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:17px;}
.team-card {width:100%;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:145px;border-radius:20px;border:1px solid #e7e7dd;background:linear-gradient(150deg,#fffefa,#fffdf9);padding:17px;box-shadow:0 3px 9px #24452709;}
.team-card:hover{border-color:#95d39f;box-shadow:0 12px 24px #177a2e12;}
.team-card .topline{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.team-card .order {font-size:1.4rem;font-weight:880;color:#078943;letter-spacing:-.04em;}
.team-card .teamname{font-size:1.05rem;font-weight:850;}
.team-card .foot{display:flex;justify-content:space-between;align-items:center;color:#6b7a71;font-size:.76rem;}
.team-card .foot .icon {color:var(--green);}
.judge-layout {display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start;}
.judge-main {min-width:0;}
.team-hero {padding:22px 23px; background:linear-gradient(115deg,#fffefa 15%,#f6f9ee 73%,#effcde);border:1px solid #e7eada;border-radius:23px;margin-bottom:17px;position:relative;overflow:hidden;}
.team-hero> *:not(.wave-art){position:relative;z-index:1;}
.team-hero h1{font-size:clamp(2rem,3vw,3.2rem);margin:8px 0 10px;}
.team-hero h1 span{color:var(--green);}
.team-hero .wave-art{width:48%;opacity:.6;}
.inline-meta {display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
.progress-panel {background:#eff9e5;border-radius:18px;padding:15px 18px;margin-bottom:16px;display:flex;justify-content:space-between;gap:20px;align-items:center;}
.progress-segs {display:flex;gap:4px;margin-top:9px;}
.progress-segs span{height:7px;width:42px;max-width:22%;background:#d0dfc5;border-radius:99px;}
.progress-segs span.on{background:linear-gradient(90deg,#08a543,#10b84e);}
.criteria-list {display:grid;gap:12px;}
.criterion {padding:20px;border:1px solid #e9e8df;background:#fffefa;border-radius:21px;box-shadow:0 9px 21px #23452e0a;}
.criterion-head {display:flex;gap:13px;align-items:center;justify-content:space-between;margin-bottom:15px;}
.criterion-heading{display:flex;align-items:center;gap:12px;min-width:0;}
.criterion-symbol {width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#eaf8df;color:#148744;flex:none;}
.criterion-label{font-size:1rem;font-weight:840;}
.criterion-hint{font-size:.77rem;color:#7a877c;}
.score-value {background:#ebf8df;color:#145534;font-size:1.3rem;font-weight:850;padding:4px 11px;border-radius:999px;white-space:nowrap;}
.score-value small {color:#71907a;font-size:.8rem;}
.score-grid {display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;}
.score-btn {border:1px solid #d9dbd2;background:linear-gradient(#fff,#fff9ef);border-radius:11px;min-height:45px;font-weight:850;font-size:1rem;color:#133d2c;box-shadow:0 3px 4px #543e2114;}
.score-btn:hover {border-color:#16a64d;background:#eaf9df;}
.score-btn.selected {color:white;border-color:#008b38;background:linear-gradient(150deg,#2aca4f,#00682b);box-shadow:0 4px 14px #12984136;}
.extra-score {display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;}
.extra-score .hint{color:#819286;font-size:.72rem;}
.mini-actions{display:flex;gap:6px;}
.mini-btn{border:1px solid #d5dfd3;background:#fffefa;color:#2e6441;border-radius:10px;padding:7px 11px;font-size:.78rem;font-weight:850;min-height:32px;}
.mini-btn.on {background:#cef3a6;border-color:#93d479;color:#1d6e31;}
.summary-panel {background:linear-gradient(125deg,#053d2c,#006336 72%,#128b3d);color:white;border-radius:22px;position:relative;overflow:hidden;padding:23px 24px;box-shadow:0 12px 30px #0653392a;}
.summary-panel .wave-art{opacity:.38;}
.summary-panel> *:not(.wave-art){position:relative;z-index:1;}
.summary-panel h2 {color:white;font-size:clamp(2.3rem,4vw,3.7rem);letter-spacing:-.06em;}
.summary-panel .suptitle {font-size:.76rem;font-weight:800;letter-spacing:.14em;color:#cafba3;}
.summary-panel p {color:#c5e3cc;font-size:.79rem;margin-top:5px;}
.summary-panel .neutral-value {font-size:1.7rem;margin-top:6px;}
.side-summary {display:grid;gap:13px;position:sticky;top:98px;}
.side-info{padding:19px;background:#fffefa;border-radius:20px;border:1px solid var(--border);}
.side-info .row{padding:10px 0;display:flex;justify-content:space-between;border-bottom:1px solid #efeee6;font-size:.82rem;gap:14px;}
.side-info .row:last-child{border:0;}
.submit-bar {display:flex;align-items:center;gap:14px;justify-content:space-between;margin-top:17px;padding:12px 0;}
.draft-indicator {display:flex;align-items:center;gap:8px;color:#208449;font-size:.82rem;font-weight:720;}
.notice {padding:14px 17px;border-radius:16px;background:#eef7e7;color:#315e3f;font-size:.85rem;border:1px solid #dbead2;}
.notice.warn {background:#fff8e9;color:#8d5e21;border-color:#f0dfbb;}
.toolbar {display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
.admin-tabs {display:flex;gap:5px;overflow:auto;max-width:100%;padding-bottom:2px;}
.admin-panel{padding:23px;}
.admin-table {width:100%;border-collapse:separate;border-spacing:0;font-size:.86rem;min-width:640px;}
.admin-table th{background:#f1f7e9;color:#53705d;font-size:.74rem;letter-spacing:.02em;text-align:left;padding:12px 13px;}
.admin-table td{border-bottom:1px solid #e7ebe2;padding:11px 13px;}
.admin-table tr:last-child td{border-bottom:none;}
.admin-table th:first-child{border-top-left-radius:10px;}
.admin-table th:last-child{border-top-right-radius:10px;}
.table-wrap {overflow:auto;max-width:100%;border:1px solid #ebeee6;border-radius:16px;}
.row-tools{display:flex;gap:6px;align-items:center;}
.progress-track {height:7px;background:#e9eee4;border-radius:99px;overflow:hidden;width:90px;}
.progress-track>span{display:block;background:linear-gradient(90deg,#08a543,#55cd5c);height:100%;border-radius:99px;}
.admin-section {display:grid;grid-template-columns:minmax(0,1.25fr) minmax(290px,.75fr);gap:16px;align-items:start;}
.admin-brief{background:#f0f8e7;border:1px solid #dbeccf;border-radius:18px;padding:17px;}
.admin-brief h3{margin-bottom:9px;}
.admin-brief p{color:#5e7465;font-size:.88rem;}
.stage {background:radial-gradient(circle at 55% 18%,#19794d 0%,#045336 40%,#03291d 100%);color:#fff;position:relative;overflow:hidden;border-radius:27px;min-height:620px;box-shadow:0 26px 60px #002d2280;border:1px solid #1b7650;}
.stage:before {content:"";position:absolute;left:-20%;right:-20%;bottom:-30%;height:65%;background:radial-gradient(ellipse,#80fd543f,transparent 67%);pointer-events:none;}
.stage>.wave-art {opacity:.65;bottom:-40%;width:90%;}
.stage-inner {position:relative;z-index:1;padding:clamp(22px,4.5vw,65px);height:100%;}
.stage-heading{text-align:center;margin-bottom:25px;}
.stage-heading .kicker {color:#b6fb78;}
.stage-heading h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:-.035em;color:white;font-size:clamp(2rem,4.4vw,4.5rem);}
.stage-heading p {color:#c1e8cb;margin-top:10px;font-size:.9rem;}
.podium {display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:15px;align-items:end;max-width:1110px;margin:40px auto 0;}
.podium-card{background:linear-gradient(175deg,#fffdf1,#f4e6c2);border:2px solid #dcb86a;color:#0d3c2b;padding:22px 14px;border-radius:22px;text-align:center;min-height:224px;box-shadow:0 12px 35px #001f1933;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
.podium-card.first {min-height:292px;border-color:#ffde8e;box-shadow:0 0 28px #ffd97172, 0 20px 45px #001e204d;}
.podium-card.silver{background:linear-gradient(165deg,#ffffff,#dfe6e4);border-color:#b8cbcc;}
.podium-card.bronze{background:linear-gradient(165deg,#fffaf3,#e4b79f);border-color:#c18a6a;}
.medal {font-size:2.6rem;line-height:1;}
.podium-card h2 {font-size:clamp(1.2rem,2vw,2.05rem);letter-spacing:-.045em;}
.podium-card .points {font-size:clamp(1.6rem,2.8vw,3rem);font-weight:920;letter-spacing:-.06em;color:#075e35;}
.podium-card small{color:#63756b;font-size:.76rem;}
.stage-bar {display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:16px;flex-wrap:wrap;}
.stage-actions{display:flex;gap:8px;flex-wrap:wrap;}
.preview-stamp{position:absolute;top:14px;right:20px;background:#f8e2a9;color:#684c15;font-size:.68rem;font-weight:900;letter-spacing:.06em;padding:7px 11px;border-radius:99px;z-index:3;}
.results-stage{background:linear-gradient(155deg,#fffefa,#f4f9ed);border:1px solid #e0e8d8;color:var(--deep);}
.results-stage:before{display:none;}
.results-stage .stage-heading h1{color:var(--deep);font-family:inherit;}
.results-stage .stage-heading p{color:#66846b;}
.results-stage .stage-heading .kicker{color:#159447;}
.results-table{width:100%;border-collapse:collapse;min-width:960px;box-shadow:0 7px 18px #113b2520;}
.results-table th {background:#08633b;color:#fff;font-size:.76rem;padding:12px 9px;text-align:center;vertical-align:bottom;border-right:1px solid #ffffff31;}
.results-table td{padding:10px 9px;text-align:center;color:#1f4d37;border-bottom:1px solid #e3eddc;font-size:.84rem;}
.results-table tbody tr{background:#fffefb;}
.results-table tbody tr:nth-child(even){background:#f1f9ed;}
.results-table tbody tr.top{background:#e2f5d5;}
.results-table td.team-col {text-align:left;font-weight:850;white-space:nowrap;}
.results-table td:last-child{font-weight:920;background:#d5efc9;color:#075f36;font-size:.96rem;}
.results-foot {color:#5b7863;font-size:.78rem;text-align:center;margin-top:15px;}
.modal-backdrop{position:fixed;inset:0;background:rgba(4,24,19,.6);display:grid;place-items:center;padding:18px;z-index:100;backdrop-filter:blur(6px);}
.modal{width:min(530px,100%);max-height:90vh;overflow:auto;background:#fffefa;border-radius:24px;box-shadow:0 30px 80px #001b1666;padding:28px;}
.modal h2{margin-bottom:8px;}
.modal p{color:#617468;font-size:.87rem;}
.modal-table{margin:20px 0;border:1px solid #e8ede1;border-radius:16px;overflow:hidden;}
.modal-row {display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border-bottom:1px solid #e8ede1;font-size:.88rem;}
.modal-row:last-child {border:0;}
.modal-actions {display:flex;gap:11px;justify-content:flex-end;margin-top:18px;}
.modal-total{background:linear-gradient(110deg,#063e2b,#007642);color:white;border-radius:15px;padding:18px;display:flex;align-items:center;justify-content:space-between;}
.modal-total strong{font-size:1.8rem;letter-spacing:-.06em;}
.toast-area{position:fixed;bottom:20px;right:20px;z-index:120;max-width:min(420px,calc(100vw - 40px));}
.toast{background:#063f2c;color:white;box-shadow:0 12px 30px #011b1f4d;padding:13px 18px;border-radius:14px;font-size:.86rem;font-weight:760;}
.admin-setting-row{display:flex;align-items:center;gap:11px;flex-wrap:wrap;}
.admin-setting-row .input {width:110px;}
.mini-divider {height:1px;background:#e7ece4;margin:16px 0;}
.empty{padding:33px;text-align:center;color:#7b887e;}
.check-note{display:flex;align-items:center;gap:8px;color:#2d7846;font-size:.8rem;font-weight:760;}
.small-gray{font-size:.77rem;color:#708376;}
@media(max-width:1100px) {
  .header-inner {padding:12px 18px;}
  .shell{padding:22px 18px 65px;}
  .header-nav {gap:0;}
  .head-link{padding:8px 9px;}
  .judge-layout {grid-template-columns:minmax(0,1fr) 260px;}
  .admin-section {grid-template-columns:1fr;}
  .team-grid {grid-template-columns:repeat(2,minmax(0,1fr));}
  .score-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
}
@media(max-width:760px) {
  .header-inner {min-height:66px;padding:9px 14px;}
  .brand-title{font-size:1.35rem;}
  .sprout{width:25px;height:25px;}
  .sprout svg{width:19px;height:19px;}
  .brand-divider{height:29px;}
  .event-name{font-size:.78rem;}
  .header-nav{display:none;}
  .demo-label{font-size:.67rem;padding:6px 8px;}
  .avatar{display:none;}

.cover-tagline{font-size:clamp(1.7rem,2.6vw,2.75rem);line-height:1.12;max-width:640px;margin-top:25px;}
.cover-underline{margin:28px 0 25px}
.cover-description{font-size:clamp(.99rem,1.15vw,1.16rem);line-height:1.6;max-width:570px;color:#f3f6ef}
.cover-actions{margin-top:30px}
.cover-actions .btn{min-height:61px;padding-inline:30px;gap:16px}
.cover-actions .btn.primary{background:linear-gradient(135deg,#f4d992,#e2b96e);color:#13331e;border-color:#f8e9c2}
.cover-art{position:relative;overflow:visible;display:block;min-height:590px;width:100%;align-self:stretch;}
.hero-ribbon-image{position:absolute;display:block;right:-2%;top:50%;transform:translateY(-51%);width:108%;height:auto;max-width:none;object-fit:contain;mix-blend-mode:normal;filter:saturate(1.03) contrast(1.04) drop-shadow(0 16px 45px rgba(0,0,0,.12));mask-image:linear-gradient(90deg,transparent 0%,#000 11%,#000 93%,rgba(0,0,0,.96) 100%);-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 11%,#000 93%,rgba(0,0,0,.96) 100%);animation:heroArtFloat 16s ease-in-out infinite alternate;}
@keyframes heroArtFloat{from{transform:translateY(-51%) translateY(0)}to{transform:translateY(-51%) translateY(-5px)}}
.hero-art-shine{position:absolute;right:29%;top:16%;width:23%;height:20%;border-radius:50%;background:radial-gradient(circle,rgba(249,235,182,.16),transparent 72%);filter:blur(26px);pointer-events:none}
.landing-glow-a{top:0;left:-14%}
.landing-glow-b{right:3%;top:0}
.panel-pills{position:relative;z-index:3;width:min(1390px,calc(100% - 76px));margin:-105px auto 0;padding:14px 12px;background:linear-gradient(115deg,rgba(243,242,225,.90),rgba(246,238,213,.82));border:1px solid rgba(245,248,234,.75);border-radius:28px;box-shadow:0 22px 50px rgba(3,26,17,.16);backdrop-filter:blur(18px)}
.pillar-card{padding:18px 24px;gap:20px;align-items:center;}
.pillar-card+.pillar-card{border-left:1px solid rgba(17,51,27,.15)}
.pillar-icon{width:78px;height:78px;min-width:78px;border-radius:20px;background:linear-gradient(135deg,#154f35,#072f20);color:#edd08b}
.pillar-body strong{font-size:1.2rem}
.pillar-body small{font-size:.93rem;line-height:1.4}
.home-story-grid{width:min(1380px,calc(100% - 76px));margin:52px auto 30px;}
@media(max-width:1200px){
 .landing-hero{padding-inline:30px;min-height:745px}
 .landing-grid{grid-template-columns:minmax(0,1fr) minmax(0,.92fr)}
 .cover-title{font-size:clamp(3.35rem,5.2vw,4.9rem)}
 .cover-tagline{font-size:clamp(1.52rem,2.4vw,2.45rem)}
 .cover-art{min-height:570px}
 .hero-ribbon-image{right:-10%;width:119%}
 .panel-pills{width:calc(100% - 60px)}
}
@media(max-width:900px){
 .landing-hero{padding:32px 22px 110px;min-height:auto}
 .landing-grid{grid-template-columns:1fr;gap:0;min-height:0}
 .cover-copy{padding-top:0;max-width:670px}
 .cover-title{font-size:clamp(3.35rem,8.2vw,5.4rem)}
 .cover-tagline{font-size:clamp(1.6rem,4vw,2.4rem)}
 .cover-art{min-height:450px;width:100%;max-width:700px;margin:auto}
 .hero-ribbon-image{top:49%;right:0;width:100%;max-width:680px}
 .panel-pills{width:calc(100% - 36px);margin-top:-76px;}
 .pillar-card+.pillar-card{border:0;border-top:1px solid rgba(17,51,27,.12)}
 .home-story-grid{width:calc(100% - 36px);margin-top:30px}
}
@media(max-width:560px){
 .site-head-home .header-inner{min-height:66px;padding:0 19px}
 .site-head-home .brand-title{font-size:1.55rem}
 .landing-hero{padding:25px 19px 80px}
 .cover-kicker-row{white-space:normal;margin-bottom:18px;gap:9px}
 .cover-kicker{font-size:.83rem}
 .pill.champ{font-size:.68rem;padding:5px 10px}
 .cover-title{font-size:clamp(2.65rem,11vw,4.1rem);line-height:.94}
 .cover-tagline{font-size:1.57rem;margin-top:20px}
 .cover-underline{margin:18px 0 20px}
 .cover-description{font-size:.94rem;line-height:1.56}
 .cover-actions{flex-direction:column;gap:12px;margin-top:22px}
 .cover-actions .btn{min-height:55px}
 .cover-art{min-height:290px;margin-top:2px}
 .hero-ribbon-image{width:113%;right:-6%;}
 .panel-pills{width:calc(100% - 24px);margin-top:-45px;padding:10px;border-radius:20px}
 .pillar-card{gap:13px;padding:14px}
 .pillar-icon{width:54px;height:54px;min-width:54px;border-radius:14px}
 .pillar-icon .icon{width:25px;height:25px}
 .pillar-body strong{font-size:.99rem}
 .pillar-body small{font-size:.8rem}
 .home-story-grid{width:calc(100% - 24px)}
}

}

/* PI Champion Season 2 — Unified art direction v4.
   Cinematic on cover & reveal, restrained and readable for judge/admin working screens. */
:root{--brand-deep:#022e22;--brand-forest:#064833;--brand-mid:#08784b;--brand-mint:#68db9e;--brand-gold:#e8c979;--brand-gold-2:#f8dfa4;--brand-ivory:#fbfaf5;--brand-stone:#eae7db;--ring-shadow:0 18px 50px rgba(5,40,28,.13)}
body{background:linear-gradient(165deg,#f7f6f1 0%,#fdfcf7 42%,#f1f5ed 100%);min-height:100vh}
.site-head-workspace{background:linear-gradient(100deg,#042e22,#0a5636 66%,#083c2c);border-bottom:1px solid rgba(241,228,179,.22);box-shadow:0 7px 30px rgba(6,48,30,.15)}
.site-head-workspace .brand-title{color:#fcf8ed}
.site-head-workspace .brand-divider{background:rgba(250,244,223,.25)}
.site-head-workspace .event-name{color:#f5f8ed}
.site-head-workspace .event-name em{color:#d8eeb5}
.site-head-workspace .head-link{color:#daedde}
.site-head-workspace .head-link.active{background:rgba(222,245,208,.18);color:#ffffff;box-shadow:inset 0 -2px #ebcf86}
.site-head-workspace .head-link:hover{background:rgba(255,255,255,.10);color:white}
.site-head-workspace .demo-label{background:rgba(233,217,147,.12);color:#eedd9e;border-color:rgba(248,224,166,.24)}
.site-head-workspace .avatar{background:linear-gradient(130deg,#f7f7ed,#d7eecb)}
.shell{max-width:1540px;padding-top:30px}
.page-top h2{font-size:clamp(2rem,3.6vw,3.1rem);font-weight:800;color:#073c2d;letter-spacing:-.055em}
.page-top .kicker{color:#0f8b50;letter-spacing:.14em;font-weight:800}
.page-top p{color:#61756b}
.section-eyebrow{font-size:.71rem;letter-spacing:.18em;font-weight:800;color:#acd48e;text-transform:uppercase}
.btn.primary{background:linear-gradient(135deg,#0aaf58,#007341 72%,#005939);border:1px solid rgba(255,255,255,.2);color:white;box-shadow:0 8px 21px rgba(2,102,52,.21),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.primary:hover{box-shadow:0 13px 30px rgba(2,102,52,.29),inset 0 1px 0 rgba(255,255,255,.23)}
.btn.outline{border-color:#c7d7c6;background:linear-gradient(145deg,#fff,#fafcf8)}
.btn{letter-spacing:-.015em}
.card,.side-info{border-color:#dce7d9;box-shadow:0 16px 40px rgba(15,52,29,.075),inset 0 1px 0 #fff}

/* Cinematic login. All input controls remain real HTML. */
.access-experience{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(360px,.9fr);min-height:680px;max-width:1320px;margin:6px auto 20px;border-radius:34px;overflow:hidden;background:linear-gradient(117deg,#033223,#09563a 60%,#092b24);box-shadow:0 35px 80px rgba(1,35,24,.17);isolation:isolate}
.access-atmosphere{padding:62px 40px 30px 58px;position:relative;min-height:680px;overflow:hidden;color:#fffcf2;background:radial-gradient(ellipse at 48% 95%,rgba(57,191,111,.25),transparent 67%),linear-gradient(142deg,#062f23,#0c5a3b)}
.access-atmosphere:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,28,17,.25),transparent 56%),var(--hero-art) 54% 83%/125% auto no-repeat;mix-blend-mode:screen;opacity:.80;mask-image:linear-gradient(180deg,transparent 5%,#000 36%,#000 85%,transparent 100%)}
.access-atmosphere>*{position:relative;z-index:1}
.experience-eyebrow{letter-spacing:.18em;color:#efd99a;font-size:.73rem;font-weight:800}
.access-atmosphere h1{font:700 clamp(3rem,5vw,5.35rem)/.99 Georgia,serif;letter-spacing:-.06em;margin:28px 0 12px;color:#fff9e7;text-wrap:balance}
.access-atmosphere h1 em{display:inline-block;font-style:italic;color:#efd99d}
.access-atmosphere p{font-size:1.06rem;line-height:1.55;color:#e7f4e8;max-width:370px}
.access-artwork{position:absolute;inset:0;z-index:0;pointer-events:none}
.access-mascot{position:absolute;bottom:48px;right:30px;width:162px;height:162px;filter:drop-shadow(0 20px 23px rgba(0,20,14,.26));z-index:2}
.access-form-column{display:grid;place-items:center;padding:40px 34px;position:relative;background:radial-gradient(circle at 97% 12%,#d9efbc44,transparent 48%),linear-gradient(135deg,#f4f8ec,#fdfcf5 70%)}
.access-form-column:before{content:"";position:absolute;width:80%;height:38%;border-radius:50%;background:radial-gradient(ellipse,rgba(157,208,161,.27),transparent 69%);filter:blur(18px)}
.access.access-elevated{width:100%;max-width:486px;margin:0;border-radius:30px;box-shadow:0 28px 70px rgba(5,66,38,.17),0 2px 6px rgba(5,66,38,.06);background:linear-gradient(152deg,rgba(255,255,253,.96),rgba(248,252,245,.97));position:relative;z-index:2}
.access-elevated>.card-pad{padding:clamp(25px,3vw,43px)}
.access-elevated .access-brand{width:67px;height:67px;border-radius:19px;background:linear-gradient(145deg,#e4f6d7,#fafff6);color:#0b8550;box-shadow:inset 0 1px 0 white,0 10px 22px rgba(2,101,51,.10)}
.access-elevated h2{font-size:clamp(2rem,3vw,2.8rem);letter-spacing:-.06em;color:#084330}
.access-elevated .label{color:#164632}
.access-elevated .input{border-radius:14px;background:white;min-height:58px;font-size:1.14rem;letter-spacing:.065em}
.access-elevated .access-hint{border:1px solid #d7e8d2;background:linear-gradient(140deg,#edf8e7,#f7f9f0)}
.access-actions{display:grid;grid-template-columns:1fr 1.1fr;gap:10px;margin-top:24px}
.access-actions .btn{min-height:53px}
.access-back{margin-top:20px}

/* Judge team dashboard visual hierarchy */
.journey-intro{position:relative;display:flex;align-items:center;min-height:150px;padding:27px 31px;margin-bottom:18px;border-radius:25px;overflow:hidden;background:linear-gradient(105deg,#053324,#0b5d40 61%,#0b774b);color:#fff;box-shadow:0 18px 36px rgba(4,71,43,.15)}
.journey-intro>*{position:relative;z-index:1}

/* PI Champion S2 — lightweight self-contained WebGL ribbon scene.
 * Decorative only: the entire application works without WebGL.
 * No external dependencies, no tracking, no network calls.
 */
(() => {
  'use strict';
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let current = null;
  let active = true;
  const scene = { sync };
  window.PIChampionRibbon3D = scene;

  function sync() {
    const node = document.querySelector('canvas[data-ribbon-scene]');
    if (current && current.node === node) return;
    if (current) { current.dispose(); current = null; }
    if (!node || reduced()) return;
    const gl = node.getContext('webgl', { alpha: true, antialias: true, premultipliedAlpha: false, powerPreference: 'low-power' });
    if (!gl) return;
    try { current = createScene(gl, node, node.dataset.ribbonScene === 'stage'); }
    catch (err) { console.warn('Ribbon fallback active:', err); current = null; }
  }
  function compile(gl, type, source) {
    const shader = gl.createShader(type); gl.shaderSource(shader, source); gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  }

    const vertex = `
      attribute vec2 uv;
      uniform float time; uniform float aspect; uniform float isStage;
      varying vec3 P; varying vec2 U; varying float shade;
      void main(){
        float x=uv.x; float v=uv.y-0.5;
        float t=time*0.11;
        float curve=sin(x*4.5-1.0+t)*0.26+sin(x*8.3+0.5-t*0.55)*0.035;
        float width=0.14+0.16*sin(x*3.14159);
        float px=mix(-1.48,1.53,x);
        float py=-0.27 + 0.56*x + curve + v*width*cos(x*7.0+0.3+t);
        float pz=0.2*sin(x*5.2+t) + v*(0.58*sin(x*5.0-0.4+t)+0.24);
        if(isStage>0.5){
          py=-0.47 + 0.42*sin(x*4.9-0.6+t*0.55) + v*width*1.9*cos(x*7.1+t);
          px=mix(-1.65,1.65,x);
          pz=0.25*sin(x*5.3+t)+v*(0.9*sin(x*5.8+t));
        }
        vec3 p=vec3(px,py,pz);
        P=p; U=uv;
        shade=0.52+0.48*sin(uv.y*3.2+uv.x*3.7);
        gl_Position=vec4(p.x, p.y, clamp(-p.z*0.13,-0.9,0.9),1.0);
      }`;
    const fragment = `
      #extension GL_OES_standard_derivatives : enable
      precision highp float;
      uniform float time; uniform float isStage;
      varying vec3 P; varying vec2 U; varying float shade;
      void main(){
        vec3 dpdx=dFdx(P); vec3 dpdy=dFdy(P);
        vec3 normal=normalize(cross(dpdx,dpdy));
        vec3 light=normalize(vec3(-0.58,0.90,1.4));
        float lit=0.45+0.55*abs(dot(normal,light));
        float spec=pow(max(0.0,dot(reflect(-light,normal),normalize(vec3(0.1,0.2,1.0)))),22.0);
        float edge=pow(abs(U.y-0.5)*2.0,4.0);
        float lines=0.5+0.5*cos(U.y*122.0+U.x*5.0);
        float fine=0.5+0.5*cos(U.y*235.0-U.x*10.0);
        float glow=pow(max(0.0,1.0-abs(U.y-0.75)*3.0),7.0);
        vec3 emerald=vec3(0.008,0.24,0.13);
        vec3 jade=vec3(0.04,0.56,0.24);
        vec3 bright=vec3(0.56,0.92,0.43);
        vec3 col=mix(emerald,jade,smoothstep(0.02,0.9,U.y)*0.8);
        col=mix(col,bright,clamp(spec*1.2 + glow*.32 + edge*.20,0.0,0.87));
        col*=0.78+0.29*lit;
        col+=vec3(0.05,0.12,0.02)*lines*.20+vec3(0.07,0.10,0.03)*fine*.06;
        col+=vec3(0.26,0.30,0.13)*spec*0.43;
        float alpha=0.39+0.35*lit;
        alpha*=smoothstep(0.0,0.075,U.x)*(1.0-smoothstep(0.925,1.0,U.x));
        if(isStage>0.5){col*=1.18;alpha=min(0.95,alpha*1.45);}
        gl_FragColor=vec4(col,alpha);
      }`;
    const vs=compile(gl,gl.VERTEX_SHADER,vertex),fs=compile(gl,gl.FRAGMENT_SHADER,fragment);
    const prog=gl.createProgram();gl.attachShader(prog,vs);gl.attachShader(prog,fs);gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
    const vertices=[];const indices=[];const nx=128,ny=20;
    for(let i=0;i<=nx;i++)for(let j=0;j<=ny;j++)vertices.push(i/nx,j/ny);
    for(let i=0;i<nx;i++)for(let j=0;j<ny;j++){const a=i*(ny+1)+j,b=a+(ny+1);indices.push(a,b,a+1,b,b+1,a+1);}
    const vbo=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vbo);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);
    const ibo=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ibo);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(indices),gl.STATIC_DRAW);
    gl.useProgram(prog); const loc=gl.getAttribLocation(prog,'uv');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    const timeLoc=gl.getUniformLocation(prog,'time'),aspectLoc=gl.getUniformLocation(prog,'aspect'),stageLoc=gl.getUniformLocation(prog,'isStage');

    let frame=0,last=0,disposed=false;
    function draw(now){if(disposed)return;
      frame=requestAnimationFrame(draw);

      last=now;

      if(rect.width<1||rect.height<1)return;
      const dpr=Math.min(window.devicePixelRatio||1,1.5);

      gl.uniform1f(timeLoc,now/1000);
      gl.uniform1f(aspectLoc,rect.width/rect.height);
      gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0);

    return {node,dispose(){disposed=true;cancelAnimationFrame(frame);document.removeEventListener('visibilitychange',vis);gl.deleteBuffer(vbo);gl.deleteBuffer(ibo);gl.deleteProgram(prog);gl.deleteShader(vs);gl.deleteShader(fs);}};
  }

})();

  function record(teamId){return state.judgeScores[teamId]||{draft:{},confirmed:null};}
  const isValidScore = v => typeof v==='number'&&Number.isFinite(v)&&v>=0&&v<=10&&Number.isInteger(v*2);
  function countScores(scores){return FINAL.filter(c=>isValidScore(scores?.[c.id])).length;}
  function isComplete(teamId){return countScores(record(teamId).confirmed)===FINAL.length;}
  function isPending(teamId){const r=record(teamId);return !!r.confirmed && FINAL.some(c=>(r.draft?.[c.id]??null)!==(r.confirmed?.[c.id]??null));}
  function judgeStatus(teamId){const r=record(teamId);if(state.locked.includes(teamId))return ['Locked','dark'];if(isPending(teamId))return ['Pending Changes','warn'];if(isComplete(teamId))return ['Completed','good'];if(countScores(r.draft)>0)return ['Draft','warn'];return ['Not Started',''];}
  function myTotal(scores){if(countScores(scores)!==FINAL.length)return null;return round2(FINAL.reduce((sum,c)=>sum+scores[c.id]*c.weight/10,0));}
  function simulatedScore(idx,judge,cidx){const base=9.2-(idx*.14);const bias=[0.05,-.1,.04,-.08,.02,-.03][cidx]||0;const noise=(((judge*5+cidx*3+idx*5)%7)-3)*.11;return half(base+bias+noise);}
  function sampleScores(teamId,judge=1){return Object.fromEntries(FINAL.map((c,i)=>[c.id,simulatedScore(quality(teamId),judge,i)]));}
  function judgeCompletionCount(teamId){if(LIVE.on)return Object.keys(LIVE.confirmed[teamId]||{}).length;return 14+(isComplete(teamId)?1:0);} // fictional 14 pre-completed judges in the demo
  function averageFinalCriterion(teamId,cId){if(LIVE.on){const v=Object.values(LIVE.confirmed[teamId]||{}).map(x=>Number(x[cId])).filter(Number.isFinite);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}const cidx=FINAL.findIndex(c=>c.id===cId);let sum=0;for(let j=2;j<=15;j++)sum+=simulatedScore(quality(teamId),j,cidx);let n=14;const user=record(teamId).confirmed?.[cId];if(isValidScore(user)){sum+=user;n++;}return sum/n;}
  function finalScore(teamId){return FINAL.reduce((sum,c)=>sum+averageFinalCriterion(teamId,c.id)*c.weight/10,0);}
  function demoScore(teamId){const avgs=state.demoScores[teamId]||(LIVE.on?{}:defaultDemo(0));return DEMO.reduce((sum,c)=>sum+(Number(avgs[c.id])||0)*c.weight/10,0);}
  function overall(teamId){return round2(demoScore(teamId)*state.demoWeight/100+finalScore(teamId)*(100-state.demoWeight)/100);}
  function ranked(){const a=state.teams.map(t=>({...t,demo:demoScore(t.id),final:finalScore(t.id),overall:overall(t.id)}));a.sort((x,y)=>y.overall-x.overall||x.id-y.id);let rank=0;return a.map((t,i)=>{if(i===0||t.overall!==a[i-1].overall)rank=i+1;return {...t,rank};});}
  function hasTopTie(){const a=ranked();return a.some((x,i)=>i<4 && i>0 && x.overall===a[i-1].overall && (i<=3));}

    switch(d.type){
      case 'submit': {
        const r=record(d.teamId);if(myTotal(r.draft)===null)return toast('กรุณากรอกคะแนนทุกเกณฑ์ก่อนยืนยัน');

  function judgeDashboard(){
    const completed=state.teams.filter(t=>isComplete(t.id)).length;
    const draft=state.teams.filter(t=>!isComplete(t.id)&&countScores(record(t.id).draft)>0).length;
    const visible=state.teams.filter(t=>{const s=judgeStatus(t.id)[0];return state.filter==='all'||(state.filter==='completed'&&isComplete(t.id))||(state.filter==='draft'&&['Draft','Pending Changes'].includes(s))||(state.filter==='notstarted'&&s==='Not Started');});
    return `<div class="page-top"><div><div class="kicker">JUDGE PORTAL · PRIVATE</div><h2>Judge Dashboard</h2><p>รายชื่อทีมเรียงตามลำดับจับฉลาก แต่เลือกประเมินทีมไหนก่อนก็ได้</p></div><button class="btn outline small" data-action="logout">${icon('back')} ออกจากระบบ</button></div><div class="journey-intro"><div><span class="section-eyebrow">SELECT YOUR TEAM</span><h3>Every innovation deserves your attention.</h3><p>ให้คะแนนได้ทุกทีมตามที่ต้องการ • จัดแสดงตามลำดับจับฉลาก</p></div><div class="journey-intro-art" aria-hidden="true"></div></div><div class="stat-strip"><div class="stat"><span>ทั้งหมด</span><strong>${state.teams.length}</strong><small>Teams</small></div><div class="stat"><span>Submitted</span><strong>${completed}</strong><small>Completed</small></div><div class="stat"><span>ยังเป็น Draft</span><strong>${draft}</strong><small>Pending</small></div></div><div class="toolbar"><div class="chip-row">${[['all','ทั้งหมด'],['completed','Completed'],['draft','Draft / Pending'],['notstarted','Not Started']].map(([k,v])=>`<button class="chip ${state.filter===k?'active':''}" data-action="filter" data-filter="${k}">${v}</button>`).join('')}</div>${badge(`ส่งแล้ว ${completed}/${state.teams.length} ทีม`,'good')}</div><div class="team-grid">${visible.map(t=>{const [status,kind]=judgeStatus(t.id);const me=isComplete(t.id)?fixed(myTotal(record(t.id).confirmed)):'';return `<button class="team-card" data-action="select-team" data-id="${t.id}"><div class="topline"><span class="order">${String(state.teams.indexOf(t)+1).padStart(2,'0')}</span>${badge(status,kind)}</div><span class="teamname">${esc(t.name)}</span><span class="foot"><span>${me?`My score ${me}/100`:'แตะเพื่อให้คะแนน'}</span>${icon('arrow')}</span></button>`;}).join('')}</div>${!visible.length?'<div class="card empty">ไม่พบทีมในตัวกรองนี้</div>':''}<div class="notice" style="margin-top:19px">${icon('lock')} คะแนนที่เห็นเป็นคะแนนของคุณเท่านั้น และจะนำไปใช้คำนวณเมื่อยืนยัน Submit/Save Changes สำเร็จ</div>`;
  }
  function criterionCard(teamId,c){
    const r=record(teamId);const current=isValidScore(r.draft?.[c.id])?r.draft[c.id]:(isValidScore(r.confirmed?.[c.id])?r.confirmed[c.id]:null);
    const noEdit=state.locked.includes(teamId)||state.published;
    const base=current===null?null:Math.floor(current);
    const halfActive=current!==null && current%1===.5;

  function stage1(list,preview){
    const top=list.slice(0,3);const order=[top[1],top[0],top[2]].filter(Boolean);const cls=['silver','first','bronze'];
    return `<section class="stage" aria-label="Top 3 competition results">${wave()}<canvas class="ribbon-webgl" data-ribbon-scene="stage" aria-hidden="true"></canvas>${preview?'<div class="preview-stamp">ADMIN PREVIEW · NOT PUBLIC</div>':''}<div class="stage-inner"><div class="stage-heading"><div class="kicker">KASSET · PI CHAMPION SEASON 2</div><div class="stage-laurel" aria-hidden="true">✧ ✦ ✧</div><h1>Final Results</h1><p>Celebrating ideas that move us forward</p></div><div class="podium show-stage-podium">${order.map((t,i)=>`<article class="podium-card ${cls[i]}">${medalGraphic(t.rank)}<div class="award-label">${t.rank===1?'THE CHAMPION':t.rank===2?'FIRST RUNNER-UP':'SECOND RUNNER-UP'}</div><h2>${esc(t.name)}</h2><div class="points">${fixed(t.overall)}</div><small>OVERALL SCORE / 100</small></article>`).join('')}</div><div class="stage-floor-glow" aria-hidden="true"></div><div class="stage-broadcast-note">KAsset · PI Champion Season 2 &nbsp; · &nbsp; ${preview?'Private rehearsal only':'Official results presentation'}</div></div></section>`;
  }
  function stage2(list,preview){
    return `<section class="stage results-stage">${wave()}${preview?'<div class="preview-stamp">ADMIN PREVIEW · NOT PUBLIC</div>':''}<div class="stage-inner"><div class="stage-heading"><div class="kicker">KAsset · PI CHAMPION SEASON 2</div><h1>Detailed Final Results</h1><p>ค่าเฉลี่ยแยกตามเกณฑ์ของทุกทีม · Demo ${state.demoWeight}% + Final Day ${100-state.demoWeight}%</p></div><div class="table-wrap results-table-shell" style="border:0"><table class="results-table"><thead><tr class="results-group-row"><th colspan="2" class="group-rank">TEAM &amp; RANK</th><th colspan="${DEMO.length+1}" class="group-demo">DEMO ROUND · ${state.demoWeight}%</th><th colspan="${FINAL.length+1}" class="group-final">FINAL DAY · ${100-state.demoWeight}%</th><th class="group-overall">OVERALL</th></tr><tr><th>Rank</th><th>Team</th>${DEMO.map(c=>`<th>Demo<br/>${esc(c.name)}<br/>AVG</th>`).join('')}<th>Demo<br/>Score</th>${FINAL.map(c=>`<th>Final<br/>${esc(c.name)}<br/>AVG</th>`).join('')}<th>Final Day<br/>Score</th><th>Final<br/>Score</th></tr></thead><tbody>${list.map((t,i)=>`<tr class="${i<3?'top':''}"><td>${i<3?`<span class="rank-emblem rank-${i+1}">${i+1}</span>`:t.rank}</td><td class="team-col">${esc(t.name)}</td>${DEMO.map(c=>`<td>${fixed(state.demoScores[t.id]?.[c.id]??0)}</td>`).join('')}<td><strong>${fixed(t.demo)}</strong></td>${FINAL.map(c=>`<td>${fixed(averageFinalCriterion(t.id,c.id))}</td>`).join('')}<td><strong>${fixed(t.final)}</strong></td><td>${fixed(t.overall)}</td></tr>`).join('')}</tbody></table></div><div class="results-foot">แสดงเฉพาะค่าเฉลี่ยรายเกณฑ์ ไม่มีชื่อหรือคะแนนรายกรรมการ · คำนวณเต็มความละเอียดและปัด Overall Score 2 ตำแหน่งก่อนจัดอันดับ</div></div></section>`;
  }
  function dialog(){const d=state.dialog;if(!d)return '';
    let title='',body='',confirm='ยืนยัน',warning=false;
    if(d.type==='submit'){
      const t=state.teams.find(t=>t.id===d.teamId);const scores=record(d.teamId).draft;const total=myTotal(scores);
      title=d.isEdit?'Confirm Save Changes':'Confirm Your Scores';confirm=d.isEdit?'Save Changes':'Confirm Submit';
      body=`<p>ตรวจคะแนนของ ${esc(t.name)} ก่อนยืนยัน — ค่าที่เห็นเป็นคะแนนของคุณเท่านั้น</p><div class="modal-table">${FINAL.map(c=>`<div class="modal-row"><span>${esc(c.name)} <small>(${c.weight}%)</small></span><strong>${scores[c.id]===undefined?'—':scores[c.id].toFixed(1)} / 10</strong></div>`).join('')}</div><div class="modal-total"><span>MY TOTAL · ${d.isEdit?'NEW PREVIEW':'PREVIEW'}</span><strong>${fixed(total)} /100</strong></div>${d.isEdit?'<p style="margin-top:9px">Last Confirmed จะถูกแทนที่เมื่อกด Save Changes สำเร็จเท่านั้น</p>':'<p style="margin-top:9px">เมื่อ Confirm สำเร็จ สถานะจะเป็น Completed แต่กลับมาแก้ไขได้ก่อน Admin Lock</p>'}`;
    } else if(d.type==='simulate'){title='เติมคะแนนทดสอบให้ครบทุกทีม?';body='<p>ระบบจะใส่คะแนนสมมติแทนการประเมินของ Judge 01 สำหรับทีมที่ยังไม่ Submit เพื่อทดลอง Lock และ Publish — ไม่มีการบันทึกข้อมูลจริง</p>';confirm='เติมคะแนนจำลอง';}
    else if(d.type==='lockTeam'){title='Confirm Lock Team';const t=state.teams.find(x=>x.id===d.teamId);body=`<p>ล็อก ${esc(t.name)} แล้วกรรมการจะไม่สามารถแก้คะแนนได้จนกว่า Admin จะ Unlock ก่อน Publish</p><div class="notice">Completed ${judgeCompletionCount(d.teamId)}/${JUDGE_TOTAL()}</div>`;confirm='Confirm Lock';}
    else if(d.type==='unlockTeam'){title='Confirm Unlock Team';body='<p>Unlock ทีมนี้เพื่อให้กรรมการกลับมาแก้คะแนนได้ก่อน Publish</p>';confirm='Confirm Unlock';}
    else if(d.type==='lockAll'){title='Confirm Lock All';body='<p>ปิดการให้คะแนนของทุกทีมพร้อมกัน หลังจากกรรมการทั้งหมด Submit ครบแล้ว</p>';confirm='Lock All';}
    else if(d.type==='publish'){title='Publish Final Results?';body='<p>หลัง Publish แล้วจะไม่สามารถแก้คะแนนหรือ Unlock ได้อีก การแสดงผลจะเริ่มที่ Shot 1 (Top 3) และสามารถเปลี่ยนเป็น Shot 2 ได้</p>';confirm='Publish (Demo)';warning=true;}
    else if(d.type==='reset'){title='รีเซ็ตข้อมูล Demo?';body='<p>คะแนน Draft, Confirmed, Lock, ตารางคะแนน และการตั้งค่าทั้งหมดในเบราว์เซอร์นี้จะถูกคืนค่าเริ่มต้น</p>';confirm='รีเซ็ต';warning=true;}
    else if(d.type==='import'){title=`ยืนยัน Import CSV (${d.rows.length} ทีม)`;body=`<p>ระบบจะเขียนทับ Demo Averages ของ ${d.rows.length} ทีมที่มีอยู่ในไฟล์ พร้อมคำนวณคะแนนใหม่</p>${LIVE.on?'':'<div class="notice">Import นี้เป็นการจำลองในเบราว์เซอร์เท่านั้น</div>'}`;confirm='ยืนยัน Import';}
    return `<div class="modal-backdrop" role="presentation" data-action="dismiss-backdrop"><div class="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="kicker">PI CHAMPION · ${warning?'IMPORTANT ACTION':'CONFIRMATION'}</div><h2 id="dialog-title">${title}</h2>${body}<div class="modal-actions"><button class="btn outline" data-action="close-dialog">กลับไปแก้ไข</button><button class="btn ${warning?'primary':'primary'}" data-action="confirm-dialog">${confirm} ${icon('check')}</button></div></div></div>`;
  }
  function render(){
    const focused=document.activeElement;
    const scoreFocus=focused?.dataset?.action?.startsWith('score-')?{action:focused.dataset.action,team:focused.dataset.team,criterion:focused.dataset.criterion,value:focused.dataset.value}:null;
    const hadModal=!!document.querySelector('.modal');
    state.screen=allowedScreen(state.screen);
    let content='';switch(state.screen){case 'home':content=home();break;case 'judgeAccess':case 'adminAccess':content=access();break;case 'judgeDashboard':content=judgeDashboard();break;case 'scoring':content=scoring();break;case 'admin':content=admin();break;case 'stage':content=stage();break;default:content=home();}
    if(document.body?.dataset) document.body.dataset.screen=state.screen;
    app.innerHTML=`${metaHead()}<main class="shell">${content}</main>${dialog()}${state.toast?`<div class="toast-area" aria-live="polite"><div class="toast">${esc(LIVE.on?state.toast.replace(/\s*\((Demo|ข้อมูลจำลอง)\)/g,'').replace('ผลคะแนนจำลอง','ผลคะแนน'):state.toast)} <button type="button" style="float:right;border:0;background:transparent;color:white;margin-left:13px" data-action="close-toast" aria-label="ปิดข้อความ">×</button></div></div>`:''}`;
    window.PIChampionRibbon3D?.sync?.();
    if(state.dialog && !hadModal) requestAnimationFrame(()=>app.querySelector('.modal')?.focus({preventScroll:true}));
    if(scoreFocus){
      const matching=Array.from(app.querySelectorAll('[data-action]')).find(b=>b.dataset.action===scoreFocus.action && b.dataset.team===scoreFocus.team && b.dataset.criterion===scoreFocus.criterion && b.dataset.value===scoreFocus.value);
      if(matching && !matching.disabled) matching.focus({preventScroll:true});
    }
  }
  function generateCsv(){const rows=[['team_id',...DEMO.map(c=>c.id)],...state.teams.map(t=>[t.id,...DEMO.map(c=>state.demoScores[t.id]?.[c.id]??0)])];const data=rows.map(x=>x.join(',')).join('\r\n');const blob=new Blob([data],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pi_champion_demo_scores_template.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);}
  function handleCsv(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{
    try {const lines=String(reader.result).replace(/^\uFEFF/,'').trim().split(/\r?\n/);const headings=lines.shift().split(',').map(x=>x.trim().toLowerCase());const expected=['team_id',...DEMO.map(c=>c.id)];if(expected.some(x=>!headings.includes(x)))throw new Error('CSV ต้องมีคอลัมน์ team_id,'+DEMO.map(c=>c.id).join(',')+'');
      const rows=[];for(const line of lines){if(!line.trim())continue;const parts=line.split(',');const values=Object.fromEntries(headings.map((h,i)=>[h,(parts[i]||'').trim()]));const id=Number(values.team_id);if(!state.teams.some(t=>t.id===id))throw new Error(`ไม่พบ Team ID ${id}`);const scores={};for(const c of DEMO){const n=Number(values[c.id]);if(!Number.isFinite(n)||n<0||n>10||values[c.id]==='')throw new Error(`คะแนน ${c.id} ของ Team ${id} ต้องอยู่ 0–10`);scores[c.id]=n;}rows.push({teamId:id,scores});}if(!rows.length)throw new Error('ไฟล์ CSV ไม่มีข้อมูล');if(new Set(rows.map(x=>x.teamId)).size!==rows.length)throw new Error('พบ team_id ซ้ำกัน');state.dialog={type:'import',rows};render();
    } catch(e){toast('Import CSV ไม่สำเร็จ: '+e.message);}
  };reader.readAsText(file,'UTF-8');}
  app.addEventListener('input',e=>{const el=e.target;if(el.matches('[data-input="code"]')){state.codeInput=el.value;}if(el.matches('[data-input="new-team"]')){state.newTeamName=el.value;}});
  app.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-demo-team]')){const id=Number(el.dataset.demoTeam);const c=el.dataset.demoCriterion;const val=Number(el.value);if(el.value.trim()===''||!Number.isFinite(val)||val<0||val>10){toast('คะแนน Demo ต้องอยู่ระหว่าง 0–10');return;}state.demoScores[id]={...state.demoScores[id],[c]:val};save();render();}if(el.matches('[data-input="csv-file"]'))handleCsv(el.files?.[0]);});
  app.addEventListener('click',e=>{
    const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;
    if(a==='dismiss-backdrop'){if(e.target===btn)closeDialog();return;}
    if(a==='close-dialog'){closeDialog();return;}
    if(a==='confirm-dialog'){confirmDialog();return;}
    if(a==='close-toast'){state.toast='';render();return;}
    if(a==='nav'){changeScreen(btn.dataset.target);return;}
    if(a==='brand-home'){if(APP==='admin')state.adminTab='overview';changeScreen(DASHBOARD);return;}
    if(a==='logout'&&LIVE.on){liveLogout();return;}
    if(a==='logout'){state.auth={...(state.auth||{}),[APP]:false};changeScreen(LOGIN);return;}
    if(a==='access-judge'){state.codeInput='';changeScreen('judgeAccess');return;}
    if(a==='access-admin'){state.codeInput='';changeScreen('adminAccess');return;}
    if(a==='fill-code'){state.codeInput=btn.dataset.code;render();return;}
    if(a==='login'&&LIVE.on){liveLogin();return;}
    if(a==='login'){const role=APP;const expected=role==='admin'?'ADMINDEMO':'JUDGE01';if(state.codeInput.trim().toUpperCase()!==expected){toast(`รหัส Demo ไม่ถูกต้อง — ใช้ ${expected}`);return;}state.auth={...(state.auth||{}),[APP]:true};state.codeInput='';changeScreen(DASHBOARD);return;}
    if(a==='head-nav'){const target=btn.dataset.target;if(target==='judgeDashboard'){changeScreen('judgeDashboard');return;}if(target==='admin'){changeScreen('admin');return;}if(target==='stage'){if(state.published){state.preview=false;changeScreen('stage');}else{toast('ยังไม่ได้ Publish: กรุณาเข้า Admin เพื่อเปิด Preview แบบส่วนตัว');}return;}}
    if(a==='filter'){state.filter=btn.dataset.filter;save();render();return;}
    if(a==='select-team'){selectTeam(Number(btn.dataset.id));return;}
    if(a==='score-base'){setScore(Number(btn.dataset.team),btn.dataset.criterion,Number(btn.dataset.value));return;}
    if(a==='score-half'){const id=Number(btn.dataset.team),c=btn.dataset.criterion;const r=record(id);const current=r.draft?.[c]??r.confirmed?.[c]??null;const next=current===null?.5:(current%1===.5?Math.floor(current):Math.min(10,current+.5));setScore(id,c,next);return;}
    if(a==='submit'){const id=Number(btn.dataset.id);const r=record(id);if(myTotal(r.draft)===null)return toast('กรุณากรอกทุกเกณฑ์ก่อน Submit');openDialog('submit',id);state.dialog.isEdit=!!r.confirmed;render();return;}
    if(a==='admin-tab'){state.adminTab=btn.dataset.tab;save();render();return;}
    if(a==='simulate'){openDialog('simulate');return;}
    if(a==='lock-team'){openDialog('lockTeam',Number(btn.dataset.id));return;}
    if(a==='unlock-team'){openDialog('unlockTeam',Number(btn.dataset.id));return;}
    if(a==='lock-all'){openDialog('lockAll');return;}
    if(a==='publish'){openDialog('publish');return;}
    if(a==='preview-stage'){state.preview=!state.published;state.stageShot=1;changeScreen('stage');return;}
    if(a==='stage-shot'){state.stageShot=Number(btn.dataset.shot);save();render();return;}
    if(a==='fullscreen'){const target=document.querySelector('.stage');if(document.fullscreenElement)document.exitFullscreen?.();else target?.requestFullscreen?.();return;}
    if(a==='move-team'){const idx=state.teams.findIndex(t=>t.id===Number(btn.dataset.id)),next=idx+Number(btn.dataset.dir);if(next<0||next>=state.teams.length||state.published)return;[state.teams[idx],state.teams[next]]=[state.teams[next],state.teams[idx]];save();render();return;}
    if(a==='add-team'){if(state.published)return toast('ประกาศผลแล้ว ไม่สามารถเพิ่มทีมได้');const name=(state.newTeamName||'').trim();if(!name)return toast('กรุณากรอกชื่อทีม');if(state.teams.some(t=>t.name.toLowerCase()===name.toLowerCase()))return toast('มีชื่อทีมนี้แล้ว');const id=Math.max(...state.teams.map(t=>t.id))+1;state.teams.push({id,name});state.demoScores[id]=LIVE.on?{}:defaultDemo(state.teams.length-1);state.newTeamName='';save();toast('เพิ่มทีม '+name+' สำเร็จ (Demo)');return;}
    if(a==='download-csv'){generateCsv();return;}
    if(a==='set-weight'){state.demoWeight=Number(btn.dataset.weight);save();render();return;}
    if(a==='reset'){openDialog('reset');return;}
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&state.dialog){closeDialog();return;}
    if(e.key==='Tab'&&state.dialog){
      const modal=app.querySelector('.modal');if(!modal)return;
      const allowed=Array.from(modal.querySelectorAll('button:not(:disabled),input:not(:disabled),a[href]'));
      if(!allowed.length){e.preventDefault();modal.focus();return;}
      if(e.shiftKey && document.activeElement===allowed[0]){e.preventDefault();allowed[allowed.length-1].focus();}
      else if(!e.shiftKey && document.activeElement===allowed[allowed.length-1]){e.preventDefault();allowed[0].focus();}
    }
  });
  (async()=>{
    await detectLive();
    state.screen=allowedScreen(screenFromHash()||state.screen);
    writeHash(false);save();
    render();
  })();
})();

</script>
</body>
